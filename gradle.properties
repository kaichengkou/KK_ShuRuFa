org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle daemon rather than in a second JVM that inherits its 4 GB heap:
# CI runners for private repositories have 7 GB, and two 4 GB JVMs plus the test JVM and the
# native compilers do not fit in it.
kotlin.compiler.execution.strategy=in-process
# a download that fails for a moment (429, 5xx) is tried again, waiting longer each time
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
