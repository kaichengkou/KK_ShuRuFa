org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Compile Kotlin inside the Gradle daemon rather than in a second JVM that inherits its 4 GB heap:
# CI runners for private repositories have 7 GB, and two 4 GB JVMs plus the test JVM and the
# native compilers do not fit in it.
kotlin.compiler.execution.strategy=in-process
