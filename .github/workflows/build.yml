name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Cache Boost sources
        uses: actions/cache@v4
        with:
          path: app/src/main/jni/.cache
          key: boost-1.92.0

      # a private release key, when the repository has one in its secrets (the .p12 as base64);
      # without it the release is signed with the public key in keys/
      - name: Release key
        env:
          KK_KEYSTORE_B64: ${{ secrets.KK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KK_KEYSTORE_B64" ]; then
            echo "$KK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KK_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          KK_KEYSTORE_PASSWORD: ${{ secrets.KK_KEYSTORE_PASSWORD }}
          KK_KEY_ALIAS: ${{ secrets.KK_KEY_ALIAS }}
          KK_KEY_PASSWORD: ${{ secrets.KK_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kk-shurufa
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload keyboard renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-renders
          path: app/build/screens/
