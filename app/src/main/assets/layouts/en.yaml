# English QWERTY
id: en
label: English
engine: direct
rows:
  - [q|1, w|2, e|3, r|4, t|5, y|6, u|7, i|8, o|9, p|0]
  - [{spacer: 0.5}, "a|@", "s|#", "d|$", "f|_", "g|&", "h|-", "j|+", "k|(", "l|)", {spacer: 0.5}]
  - [{fn: shift, w: 1.5}, "z|*", "x|\"", "c|'", "v|:", "b|;", "n|!", "m|?", {fn: backspace, w: 1.5}]
  - [{fn: symbols, label: "!#1", w: 1.5}, {fn: language}, {key: ",", long: [";", ":", "!", "?", "-", "'", "\""]}, {fn: space, w: 4.5}, {key: ".", long: ["…", "?", "!", "/", "@"]}, {fn: enter, w: 1.5}]
long:
  a: [á, à, â, ä, ã, å, æ]
  e: [é, è, ê, ë, ē]
  i: [í, ì, î, ï]
  o: [ó, ò, ô, ö, õ, ø, œ]
  u: [ú, ù, û, ü]
  c: [ç]
  n: [ñ]
  s: [ß]
