# Русская раскладка ЙЦУКЕН
id: ru
label: Русский
engine: direct
rows:
  - [й|1, ц|2, у|3, к|4, е|5, н|6, г|7, ш|8, щ|9, з|0, "х|]"]
  - ["ф|!", "ы|@", "в|#", "а|₽", "п|%", "р|^", "о|&", "л|*", "д|(", "ж|)", "э|~"]
  - [{fn: shift}, "я|-", "ч|'", "с|\"", "м|:", "и|;", "т|,", "ь|ъ", "б|?", "ю|`", {fn: backspace}]
  - [{fn: symbols, label: "!#1", w: 1.5}, {fn: language}, {key: ",", long: [";", ":", "!", "?", "-", "«", "»"]}, {fn: space, w: 4.5}, {key: ".", long: ["…", "?", "!", "№", "—"]}, {fn: enter, w: 1.5}]
long:
  е: [ё]
  ь: [ъ]
  и: [й]
