# 数学键盘。每个键：k 是点按，u/d/l/r 是上/下/左/右滑。
# 每项写成 [显示, 符号模式输出, LaTeX 模式输出]，后两项省略时与前一项相同。
# ‸ 表示上屏后光标停的位置；⇥ 键跳到下一个空位：(), {}, [], 以及 ", " "; " "& " 之后。
tabs:
  - id: basic
    name: "123"
    rows:
      - - {k: ["x"], u: ["n"], d: ["t"]}
        - {k: ["7"], u: ["⁷", "⁷", "^{7}"], d: ["₇", "₇", "_{7}"]}
        - {k: ["8"], u: ["⁸", "⁸", "^{8}"], d: ["₈", "₈", "_{8}"]}
        - {k: ["9"], u: ["⁹", "⁹", "^{9}"], d: ["₉", "₉", "_{9}"]}
        - {k: ["÷", "÷", "\\div "], u: ["/"], d: ["∶", "∶", ":"]}
        - {k: ["( )", "(‸)"], u: ["[ ]", "[‸]"], d: ["{ }", "{‸}", "\\{‸\\}"]}
      - - {k: ["y"], u: ["z"], d: ["k"]}
        - {k: ["4"], u: ["⁴", "⁴", "^{4}"], d: ["₄", "₄", "_{4}"]}
        - {k: ["5"], u: ["⁵", "⁵", "^{5}"], d: ["₅", "₅", "_{5}"]}
        - {k: ["6"], u: ["⁶", "⁶", "^{6}"], d: ["₆", "₆", "_{6}"]}
        - {k: ["×", "×", "\\times "], u: ["·", "·", "\\cdot "], d: ["*"]}
        - {k: ["xⁿ", "^(‸)", "^{‸}"], u: ["x²", "²", "^{2}"], d: ["xₙ", "_(‸)", "_{‸}"]}
      - - {k: ["□/□", "(‸)/()", "\\frac{‸}{}"], u: ["%"], d: ["‰"]}
        - {k: ["1"], u: ["¹", "¹", "^{1}"], d: ["₁", "₁", "_{1}"]}
        - {k: ["2"], u: ["²", "²", "^{2}"], d: ["₂", "₂", "_{2}"]}
        - {k: ["3"], u: ["³", "³", "^{3}"], d: ["₃", "₃", "_{3}"]}
        - {k: ["−", "−", "-"], u: ["±", "±", "\\pm "], d: ["∓", "∓", "\\mp "]}
        - {k: ["√", "√(‸)", "\\sqrt{‸}"], u: ["∛", "∛(‸)", "\\sqrt[3]{‸}"], d: ["∜", "∜(‸)", "\\sqrt[4]{‸}"]}
      - - {k: ["|x|", "|‸|", "\\left|‸\\right|"]}
        - {k: ["0"], u: ["⁰", "⁰", "^{0}"], d: ["₀", "₀", "_{0}"]}
        - {k: ["."], u: [",", ",", "{,}"], d: ["×10ⁿ", "×10^(‸)", "\\times 10^{‸}"]}
        - {k: ["="], u: ["≈", "≈", "\\approx "], d: ["≠", "≠", "\\neq "], l: ["≤", "≤", "\\leq "], r: ["≥", "≥", "\\geq "]}
        - {k: ["+"], u: ["⁺", "⁺", "^{+}"]}
        - {k: ["π", "π", "\\pi "], u: ["e"], d: ["∞", "∞", "\\infty "]}
  - id: func
    name: "f(x)"
    rows:
      - - {k: ["sin", "sin(‸)", "\\sin(‸)"], u: ["arcsin", "arcsin(‸)", "\\arcsin(‸)"], d: ["sinh", "sinh(‸)", "\\sinh(‸)"]}
        - {k: ["cos", "cos(‸)", "\\cos(‸)"], u: ["arccos", "arccos(‸)", "\\arccos(‸)"], d: ["cosh", "cosh(‸)", "\\cosh(‸)"]}
        - {k: ["tan", "tan(‸)", "\\tan(‸)"], u: ["arctan", "arctan(‸)", "\\arctan(‸)"], d: ["tanh", "tanh(‸)", "\\tanh(‸)"]}
        - {k: ["cot", "cot(‸)", "\\cot(‸)"], d: ["coth", "coth(‸)", "\\coth(‸)"]}
        - {k: ["sec", "sec(‸)", "\\sec(‸)"]}
        - {k: ["csc", "csc(‸)", "\\csc(‸)"]}
      - - {k: ["ln", "ln(‸)", "\\ln(‸)"]}
        - {k: ["log", "log(‸)", "\\log(‸)"], u: ["log₂", "log₂(‸)", "\\log_2(‸)"]}
        - {k: ["lg", "lg(‸)", "\\lg(‸)"]}
        - {k: ["exp", "exp(‸)", "\\exp(‸)"]}
        - {k: ["logₐ", "log_(‸)()", "\\log_{‸}()"]}
        - {k: ["n!", "!"]}
      - - {k: ["f(x)", "f(‸)"], u: ["f⁻¹", "f⁻¹(‸)", "f^{-1}(‸)"]}
        - {k: ["g(x)", "g(‸)"]}
        - {k: ["∘", "∘", "\\circ "]}
        - {k: ["⌊x⌋", "⌊‸⌋", "\\lfloor ‸ \\rfloor"]}
        - {k: ["⌈x⌉", "⌈‸⌉", "\\lceil ‸ \\rceil"]}
        - {k: ["sgn", "sgn(‸)", "\\operatorname{sgn}(‸)"]}
      - - {k: ["max", "max(‸)", "\\max(‸)"]}
        - {k: ["min", "min(‸)", "\\min(‸)"]}
        - {k: ["mod", " mod ", "\\bmod "]}
        - {k: ["gcd", "gcd(‸)", "\\gcd(‸)"]}
        - {k: ["C(n,k)", "C(‸, )", "\\binom{‸}{}"]}
        - {k: ["i"]}
  - id: calc
    name: "∫ dx"
    rows:
      - - {k: ["lim", "lim_(x→‸) ", "\\lim_{x \\to ‸} "], u: ["lim→∞", "lim_(x→∞) ", "\\lim_{x \\to \\infty} "]}
        - {k: ["d/dx", "d/dx ", "\\frac{d}{dx} "], u: ["d²/dx²", "d²/dx² ", "\\frac{d^2}{dx^2} "], d: ["dy/dx", "dy/dx", "\\frac{dy}{dx}"]}
        - {k: ["∂/∂x", "∂/∂x ", "\\frac{\\partial}{\\partial x} "], u: ["∂²/∂x²", "∂²/∂x² ", "\\frac{\\partial^2}{\\partial x^2} "]}
        - {k: ["f′", "′", "'"], u: ["f″", "″", "''"]}
        - {k: ["∫", "∫‸ dx", "\\int ‸ \\,dx"], u: ["∫ₐᵇ", "∫_(‸)^() dx", "\\int_{‸}^{} \\,dx"]}
        - {k: ["∬", "∬", "\\iint "], u: ["∭", "∭", "\\iiint "], d: ["∮", "∮", "\\oint "]}
      - - {k: ["∑", "∑", "\\sum "], u: ["∑ₙ", "∑_(‸)^() ", "\\sum_{‸}^{} "]}
        - {k: ["∏", "∏", "\\prod "], u: ["∏ₙ", "∏_(‸)^() ", "\\prod_{‸}^{} "]}
        - {k: ["dx", " dx", "\\,dx"], u: ["dy", " dy", "\\,dy"], d: ["dt", " dt", "\\,dt"]}
        - {k: ["→", "→", "\\to "]}
        - {k: ["∞", "∞", "\\infty "]}
        - {k: ["∂", "∂", "\\partial "]}
      - - {k: ["∇", "∇", "\\nabla "], u: ["∇²", "∇²", "\\nabla^2 "]}
        - {k: ["Δ", "Δ", "\\Delta "]}
        - {k: ["ẋ", "̇", "\\dot{‸}"]}
        - {k: ["ẍ", "̈", "\\ddot{‸}"]}
        - {k: ["eˣ", "e^(‸)", "e^{‸}"]}
        - {k: ["+C", " + C"]}
      - - {k: ["ε", "ε", "\\varepsilon "]}
        - {k: ["δ", "δ", "\\delta "]}
        - {k: ["|ₐᵇ", "|_(‸)^()", "\\Big|_{‸}^{}"]}
        - {k: ["O( )", "O(‸)"]}
        - {k: ["⇒", "⇒", "\\Rightarrow "]}
        - {k: ["⇔", "⇔", "\\Leftrightarrow "]}
  - id: rel
    name: "≤ ∈"
    rows:
      - - {k: ["≤", "≤", "\\leq "], u: ["≪", "≪", "\\ll "]}
        - {k: ["≥", "≥", "\\geq "], u: ["≫", "≫", "\\gg "]}
        - {k: ["≠", "≠", "\\neq "]}
        - {k: ["≈", "≈", "\\approx "], u: ["∼", "∼", "\\sim "], d: ["≅", "≅", "\\cong "]}
        - {k: ["≡", "≡", "\\equiv "]}
        - {k: ["∝", "∝", "\\propto "]}
      - - {k: ["∈", "∈", "\\in "]}
        - {k: ["∉", "∉", "\\notin "]}
        - {k: ["⊂", "⊂", "\\subset "], u: ["⊃", "⊃", "\\supset "]}
        - {k: ["⊆", "⊆", "\\subseteq "], u: ["⊇", "⊇", "\\supseteq "]}
        - {k: ["∪", "∪", "\\cup "], u: ["⋃", "⋃", "\\bigcup "]}
        - {k: ["∩", "∩", "\\cap "], u: ["⋂", "⋂", "\\bigcap "]}
      - - {k: ["∀", "∀", "\\forall "]}
        - {k: ["∃", "∃", "\\exists "], u: ["∄", "∄", "\\nexists "]}
        - {k: ["¬", "¬", "\\neg "]}
        - {k: ["∧", "∧", "\\land "]}
        - {k: ["∨", "∨", "\\lor "]}
        - {k: ["∅", "∅", "\\varnothing "]}
      - - {k: ["⇒", "⇒", "\\Rightarrow "]}
        - {k: ["⇔", "⇔", "\\Leftrightarrow "]}
        - {k: ["∴", "∴", "\\therefore "]}
        - {k: ["∵", "∵", "\\because "]}
        - {k: ["ℝ", "ℝ", "\\mathbb{R}"], u: ["ℤ", "ℤ", "\\mathbb{Z}"], d: ["ℚ", "ℚ", "\\mathbb{Q}"]}
        - {k: ["ℕ", "ℕ", "\\mathbb{N}"], u: ["ℂ", "ℂ", "\\mathbb{C}"]}
  - id: lin
    name: "[ ]"
    rows:
      - - {k: ["2×2", "[‸, ; , ]", "\\begin{pmatrix} ‸ & \\\\ & \\end{pmatrix}"]}
        - {k: ["3×3", "[‸, , ; , , ; , , ]", "\\begin{pmatrix} ‸ & & \\\\ & & \\\\ & & \\end{pmatrix}"]}
        - {k: ["列向量", "(‸, )ᵀ", "\\begin{pmatrix} ‸ \\\\ \\end{pmatrix}"]}
        - {k: ["det", "det(‸)", "\\det(‸)"]}
        - {k: ["Aᵀ", "ᵀ", "^{\\mathsf{T}}"]}
        - {k: ["A⁻¹", "⁻¹", "^{-1}"]}
      - - {k: ["向量", "⃗", "\\vec{‸}"]}
        - {k: ["‖x‖", "‖‸‖", "\\lVert ‸ \\rVert"]}
        - {k: ["⟨ , ⟩", "⟨‸, ⟩", "\\langle ‸, \\rangle"]}
        - {k: ["·", "·", "\\cdot "]}
        - {k: ["×", "×", "\\times "]}
        - {k: ["⊗", "⊗", "\\otimes "], u: ["⊕", "⊕", "\\oplus "]}
      - - {k: ["tr", "tr(‸)", "\\operatorname{tr}(‸)"]}
        - {k: ["rank", "rank(‸)", "\\operatorname{rank}(‸)"]}
        - {k: ["dim", "dim ", "\\dim "]}
        - {k: ["ker", "ker ", "\\ker "]}
        - {k: ["λ", "λ", "\\lambda "]}
        - {k: ["I"], u: ["E"]}
      - - {k: ["均值", "̄", "\\bar{‸}"]}
        - {k: ["估计", "̂", "\\hat{‸}"]}
        - {k: ["⊥", "⊥", "\\perp "]}
        - {k: ["∥", "∥", "\\parallel "]}
        - {k: ["∠", "∠", "\\angle "]}
        - {k: ["†", "†", "^\\dagger "]}
  - id: greek
    name: "αβ"
    rows:
      - - {k: ["α", "α", "\\alpha "], u: ["Α", "Α", "A"]}
        - {k: ["β", "β", "\\beta "], u: ["Β", "Β", "B"]}
        - {k: ["γ", "γ", "\\gamma "], u: ["Γ", "Γ", "\\Gamma "]}
        - {k: ["δ", "δ", "\\delta "], u: ["Δ", "Δ", "\\Delta "]}
        - {k: ["ε", "ε", "\\varepsilon "], u: ["Ε", "Ε", "E"], d: ["ϵ", "ϵ", "\\epsilon "]}
        - {k: ["ζ", "ζ", "\\zeta "], u: ["Ζ", "Ζ", "Z"]}
      - - {k: ["η", "η", "\\eta "], u: ["Η", "Η", "H"]}
        - {k: ["θ", "θ", "\\theta "], u: ["Θ", "Θ", "\\Theta "], d: ["ϑ", "ϑ", "\\vartheta "]}
        - {k: ["ι", "ι", "\\iota "], u: ["Ι", "Ι", "I"]}
        - {k: ["κ", "κ", "\\kappa "], u: ["Κ", "Κ", "K"], d: ["ϰ", "ϰ", "\\varkappa "]}
        - {k: ["λ", "λ", "\\lambda "], u: ["Λ", "Λ", "\\Lambda "]}
        - {k: ["μ", "μ", "\\mu "], u: ["Μ", "Μ", "M"]}
      - - {k: ["ν", "ν", "\\nu "], u: ["Ν", "Ν", "N"]}
        - {k: ["ξ", "ξ", "\\xi "], u: ["Ξ", "Ξ", "\\Xi "]}
        - {k: ["ο", "ο", "o"], u: ["Ο", "Ο", "O"]}
        - {k: ["π", "π", "\\pi "], u: ["Π", "Π", "\\Pi "], d: ["ϖ", "ϖ", "\\varpi "]}
        - {k: ["ρ", "ρ", "\\rho "], u: ["Ρ", "Ρ", "P"], d: ["ϱ", "ϱ", "\\varrho "]}
        - {k: ["σ", "σ", "\\sigma "], u: ["Σ", "Σ", "\\Sigma "], d: ["ς", "ς", "\\varsigma "]}
      - - {k: ["τ", "τ", "\\tau "], u: ["Τ", "Τ", "T"]}
        - {k: ["υ", "υ", "\\upsilon "], u: ["Υ", "Υ", "\\Upsilon "]}
        - {k: ["φ", "φ", "\\varphi "], u: ["Φ", "Φ", "\\Phi "], d: ["ϕ", "ϕ", "\\phi "]}
        - {k: ["χ", "χ", "\\chi "], u: ["Χ", "Χ", "X"]}
        - {k: ["ψ", "ψ", "\\psi "], u: ["Ψ", "Ψ", "\\Psi "]}
        - {k: ["ω", "ω", "\\omega "], u: ["Ω", "Ω", "\\Omega "]}
  - id: phys
    name: "物理"
    rows:
      - - {k: ["ℏ", "ℏ", "\\hbar "], u: ["h"]}
        - {k: ["°", "°", "^\\circ "], u: ["℃", "℃", "^\\circ\\mathrm{C}"]}
        - {k: ["Ω", "Ω", "\\Omega "]}
        - {k: ["μ", "μ", "\\mu "]}
        - {k: ["Å", "Å", "\\text{Å}"]}
        - {k: ["k_B", "k_B", "k_\\mathrm{B}"]}
      - - {k: ["⟨ψ|", "⟨‸|", "\\langle ‸ |"]}
        - {k: ["|ψ⟩", "|‸⟩", "| ‸ \\rangle"]}
        - {k: ["⟨φ|ψ⟩", "⟨‸|⟩", "\\langle ‸ | \\rangle"]}
        - {k: ["†", "†", "^\\dagger "]}
        - {k: ["⊗", "⊗", "\\otimes "]}
        - {k: ["∇²", "∇²", "\\nabla^2 "]}
      - - {k: ["ẋ", "̇", "\\dot{‸}"]}
        - {k: ["ẍ", "̈", "\\ddot{‸}"]}
        - {k: ["∂ₜ", "∂ₜ", "\\partial_t "]}
        - {k: ["d/dt", "d/dt ", "\\frac{d}{dt} "]}
        - {k: ["Δ", "Δ", "\\Delta "]}
        - {k: ["δ", "δ", "\\delta "]}
      - - {k: ["⇌", "⇌", "\\rightleftharpoons "]}
        - {k: ["→", "→", "\\to "]}
        - {k: ["↑", "↑", "\\uparrow "]}
        - {k: ["↓", "↓", "\\downarrow "]}
        - {k: ["⊥", "⊥", "\\perp "]}
        - {k: ["∥", "∥", "\\parallel "]}
bottom:
  - {fn: abc, label: ABC, w: 1.3}
  - {fn: left}
  - {fn: space, label: 空格, w: 2}
  - {fn: right}
  - {fn: next_slot}
  - {fn: backspace, w: 1.3}
  - {fn: enter, w: 1.3}
