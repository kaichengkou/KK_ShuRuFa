# 学术键盘。右边是固定的数字区（pad），左边是随标签页切换的 4×4 函数区（tabs 的 keys）。
# 每个键：k 是点按，u/d/l/r 是上/下/左/右滑；长按列出全部。键上只在右上角标出上滑。
# 每项写成 [显示, 符号模式输出, LaTeX 模式输出]，后两项省略时与前一项相同。
# ‸ 表示上屏后光标停的位置；⇥ 键跳到下一个空位：(), {}, [], 以及 ", " "; " "& " 之后。
pad:
  - - {k: ["7"], u: ["⁷", "⁷", "^{7}"], d: ["₇", "₇", "_{7}"]}
    - {k: ["8"], u: ["⁸", "⁸", "^{8}"], d: ["₈", "₈", "_{8}"]}
    - {k: ["9"], u: ["⁹", "⁹", "^{9}"], d: ["₉", "₉", "_{9}"]}
    - {k: ["÷", "÷", "\\div "], u: ["/"], d: ["∶", "∶", ":"]}
  - - {k: ["4"], u: ["⁴", "⁴", "^{4}"], d: ["₄", "₄", "_{4}"]}
    - {k: ["5"], u: ["⁵", "⁵", "^{5}"], d: ["₅", "₅", "_{5}"]}
    - {k: ["6"], u: ["⁶", "⁶", "^{6}"], d: ["₆", "₆", "_{6}"]}
    - {k: ["×", "×", "\\times "], u: ["·", "·", "\\cdot "], d: ["*"]}
  - - {k: ["1"], u: ["¹", "¹", "^{1}"], d: ["₁", "₁", "_{1}"]}
    - {k: ["2"], u: ["²", "²", "^{2}"], d: ["₂", "₂", "_{2}"]}
    - {k: ["3"], u: ["³", "³", "^{3}"], d: ["₃", "₃", "_{3}"]}
    - {k: ["−", "−", "-"], u: ["±", "±", "\\pm "], d: ["∓", "∓", "\\mp "]}
  - - {k: ["0"], u: ["⁰", "⁰", "^{0}"], d: ["₀", "₀", "_{0}"]}
    - {k: ["."], u: [",", ",", "{,}"], d: ["×10ⁿ", "×10^(‸)", "\\times 10^{‸}"]}
    - {k: ["="], u: ["≈", "≈", "\\approx "], d: ["≠", "≠", "\\neq "], l: ["≤", "≤", "\\leq "], r: ["≥", "≥", "\\geq "]}
    - {k: ["+"], u: ["⁺", "⁺", "^{+}"], d: ["⁻", "⁻", "^{-}"]}
tabs:
  - id: basic
    name: "基础"
    keys:
      - - {k: ["x"], u: ["n"], d: ["t"]}
        - {k: ["y"], u: ["z"], d: ["k"]}
        - {k: ["( )", "(‸)"], u: ["[ ]", "[‸]"], d: ["{ }", "{‸}", "\\{‸\\}"]}
        - {k: ["xⁿ", "^(‸)", "^{‸}"], u: ["x²", "²", "^{2}"], d: ["xₙ", "_(‸)", "_{‸}"]}
      - - {k: ["□⁄□", "(‸)/()", "\\frac{‸}{}"], u: ["/"]}
        - {k: ["√", "√(‸)", "\\sqrt{‸}"], u: ["∛", "∛(‸)", "\\sqrt[3]{‸}"], d: ["ⁿ√", "^(‸)√()", "\\sqrt[‸]{}"]}
        - {k: ["|x|", "|‸|", "\\left|‸\\right|"]}
        - {k: ["%"], u: ["‰"]}
      - - {k: ["π", "π", "\\pi "], u: ["τ", "τ", "\\tau "]}
        - {k: ["e"], u: ["eˣ", "e^(‸)", "e^{‸}"]}
        - {k: ["i"], u: ["j"]}
        - {k: ["∞", "∞", "\\infty "]}
      - - {k: ["<"], u: ["≤", "≤", "\\leq "]}
        - {k: [">"], u: ["≥", "≥", "\\geq "]}
        - {k: ["°", "°", "^\\circ "], u: ["′"], d: ["″"]}
        - {k: ["n!", "!"]}
  - id: func
    name: "函数"
    keys:
      - - {k: ["sin", "sin(‸)", "\\sin(‸)"], u: ["arcsin", "arcsin(‸)", "\\arcsin(‸)"], d: ["sinh", "sinh(‸)", "\\sinh(‸)"]}
        - {k: ["cos", "cos(‸)", "\\cos(‸)"], u: ["arccos", "arccos(‸)", "\\arccos(‸)"], d: ["cosh", "cosh(‸)", "\\cosh(‸)"]}
        - {k: ["tan", "tan(‸)", "\\tan(‸)"], u: ["arctan", "arctan(‸)", "\\arctan(‸)"], d: ["tanh", "tanh(‸)", "\\tanh(‸)"]}
        - {k: ["cot", "cot(‸)", "\\cot(‸)"], u: ["sec", "sec(‸)", "\\sec(‸)"], d: ["csc", "csc(‸)", "\\csc(‸)"]}
      - - {k: ["ln", "ln(‸)", "\\ln(‸)"]}
        - {k: ["log", "log(‸)", "\\log(‸)"], u: ["log₂", "log₂(‸)", "\\log_2(‸)"]}
        - {k: ["logₐ", "log_(‸)()", "\\log_{‸}()"], u: ["lg", "lg(‸)", "\\lg(‸)"]}
        - {k: ["exp", "exp(‸)", "\\exp(‸)"]}
      - - {k: ["f(x)", "f(‸)"], u: ["f⁻¹", "f⁻¹(‸)", "f^{-1}(‸)"], d: ["g(x)", "g(‸)"]}
        - {k: ["∘", "∘", "\\circ "]}
        - {k: ["⌊x⌋", "⌊‸⌋", "\\lfloor ‸ \\rfloor"], u: ["⌈x⌉", "⌈‸⌉", "\\lceil ‸ \\rceil"]}
        - {k: ["sgn", "sgn(‸)", "\\operatorname{sgn}(‸)"]}
      - - {k: ["max", "max(‸)", "\\max(‸)"], u: ["min", "min(‸)", "\\min(‸)"]}
        - {k: ["mod", " mod ", "\\bmod "]}
        - {k: ["gcd", "gcd(‸)", "\\gcd(‸)"], u: ["lcm", "lcm(‸)", "\\operatorname{lcm}(‸)"]}
        - {k: ["C(n,k)", "C(‸, )", "\\binom{‸}{}"], u: ["A(n,k)", "A(‸, )", "A_{‸}^{}"]}
  - id: calc
    name: "微积分"
    keys:
      - - {k: ["lim", "lim_(x→‸) ", "\\lim_{x \\to ‸} "], u: ["lim→∞", "lim_(x→∞) ", "\\lim_{x \\to \\infty} "]}
        - {k: ["d/dx", "d/dx ", "\\frac{d}{dx} "], u: ["d²/dx²", "d²/dx² ", "\\frac{d^2}{dx^2} "], d: ["dy/dx", "dy/dx", "\\frac{dy}{dx}"]}
        - {k: ["∂/∂x", "∂/∂x ", "\\frac{\\partial}{\\partial x} "], u: ["∂²/∂x²", "∂²/∂x² ", "\\frac{\\partial^2}{\\partial x^2} "]}
        - {k: ["f′", "′", "'"], u: ["f″", "″", "''"]}
      - - {k: ["∫", "∫‸ dx", "\\int ‸ \\,dx"], u: ["∫ₐᵇ", "∫_(‸)^() dx", "\\int_{‸}^{} \\,dx"], d: ["∬", "∬", "\\iint "], r: ["∮", "∮", "\\oint "]}
        - {k: ["∑", "∑", "\\sum "], u: ["∑ₙ", "∑_(‸)^() ", "\\sum_{‸}^{} "]}
        - {k: ["∏", "∏", "\\prod "], u: ["∏ₙ", "∏_(‸)^() ", "\\prod_{‸}^{} "]}
        - {k: ["dx", " dx", "\\,dx"], u: ["dy", " dy", "\\,dy"], d: ["dt", " dt", "\\,dt"]}
      - - {k: ["→", "→", "\\to "]}
        - {k: ["∂", "∂", "\\partial "]}
        - {k: ["∇", "∇", "\\nabla "], u: ["∇²", "∇²", "\\nabla^2 "]}
        - {k: ["Δ", "Δ", "\\Delta "], u: ["δ", "δ", "\\delta "]}
      - - {k: ["ε", "ε", "\\varepsilon "]}
        - {k: ["|ₐᵇ", "|_(‸)^()", "\\Big|_{‸}^{}"]}
        - {k: ["+C", " + C"]}
        - {k: ["O( )", "O(‸)"], u: ["o( )", "o(‸)"]}
  - id: rel
    name: "逻辑"
    keys:
      - - {k: ["≤", "≤", "\\leq "], u: ["≪", "≪", "\\ll "]}
        - {k: ["≥", "≥", "\\geq "], u: ["≫", "≫", "\\gg "]}
        - {k: ["≠", "≠", "\\neq "], u: ["≡", "≡", "\\equiv "]}
        - {k: ["≈", "≈", "\\approx "], u: ["∼", "∼", "\\sim "], d: ["≅", "≅", "\\cong "], r: ["∝", "∝", "\\propto "]}
      - - {k: ["∈", "∈", "\\in "], u: ["∉", "∉", "\\notin "]}
        - {k: ["⊂", "⊂", "\\subset "], u: ["⊃", "⊃", "\\supset "]}
        - {k: ["⊆", "⊆", "\\subseteq "], u: ["⊇", "⊇", "\\supseteq "]}
        - {k: ["∅", "∅", "\\varnothing "]}
      - - {k: ["∪", "∪", "\\cup "], u: ["⋃", "⋃", "\\bigcup "]}
        - {k: ["∩", "∩", "\\cap "], u: ["⋂", "⋂", "\\bigcap "]}
        - {k: ["∀", "∀", "\\forall "]}
        - {k: ["∃", "∃", "\\exists "], u: ["∄", "∄", "\\nexists "]}
      - - {k: ["¬", "¬", "\\neg "], u: ["∧", "∧", "\\land "], d: ["∨", "∨", "\\lor "]}
        - {k: ["⇒", "⇒", "\\Rightarrow "], u: ["∴", "∴", "\\therefore "], d: ["∵", "∵", "\\because "]}
        - {k: ["⇔", "⇔", "\\Leftrightarrow "]}
        - {k: ["ℝ", "ℝ", "\\mathbb{R}"], u: ["ℤ", "ℤ", "\\mathbb{Z}"], d: ["ℚ", "ℚ", "\\mathbb{Q}"], l: ["ℕ", "ℕ", "\\mathbb{N}"], r: ["ℂ", "ℂ", "\\mathbb{C}"]}
  - id: lin
    name: "线代"
    keys:
      - - {k: ["2×2", "[‸, ; , ]", "\\begin{pmatrix} ‸ & \\\\ & \\end{pmatrix}"], u: ["3×3", "[‸, , ; , , ; , , ]", "\\begin{pmatrix} ‸ & & \\\\ & & \\\\ & & \\end{pmatrix}"]}
        - {k: ["列向量", "(‸, )ᵀ", "\\begin{pmatrix} ‸ \\\\ \\end{pmatrix}"]}
        - {k: ["det", "det(‸)", "\\det(‸)"]}
        - {k: ["Aᵀ", "ᵀ", "^{\\mathsf{T}}"], u: ["A⁻¹", "⁻¹", "^{-1}"]}
      - - {k: ["v⃗", "⃗", "\\vec{‸}"]}
        - {k: ["‖x‖", "‖‸‖", "\\lVert ‸ \\rVert"]}
        - {k: ["⟨ , ⟩", "⟨‸, ⟩", "\\langle ‸, \\rangle"]}
        - {k: ["⊗", "⊗", "\\otimes "], u: ["⊕", "⊕", "\\oplus "]}
      - - {k: ["tr", "tr(‸)", "\\operatorname{tr}(‸)"]}
        - {k: ["rank", "rank(‸)", "\\operatorname{rank}(‸)"], u: ["dim", "dim ", "\\dim "], d: ["ker", "ker ", "\\ker "]}
        - {k: ["λ", "λ", "\\lambda "]}
        - {k: ["I"], u: ["E"]}
      - - {k: ["x̄", "̄", "\\bar{‸}"], u: ["x̂", "̂", "\\hat{‸}"]}
        - {k: ["⊥", "⊥", "\\perp "], u: ["∥", "∥", "\\parallel "]}
        - {k: ["∠", "∠", "\\angle "]}
        - {k: ["†", "†", "^\\dagger "]}
  - id: greek
    name: "希腊"
    keys:
      - - {k: ["α", "α", "\\alpha "], u: ["Α", "Α", "A"]}
        - {k: ["β", "β", "\\beta "], u: ["Β", "Β", "B"]}
        - {k: ["γ", "γ", "\\gamma "], u: ["Γ", "Γ", "\\Gamma "], d: ["χ", "χ", "\\chi "]}
        - {k: ["δ", "δ", "\\delta "], u: ["Δ", "Δ", "\\Delta "], d: ["ζ", "ζ", "\\zeta "]}
      - - {k: ["ε", "ε", "\\varepsilon "], u: ["Ε", "Ε", "E"], d: ["ϵ", "ϵ", "\\epsilon "]}
        - {k: ["θ", "θ", "\\theta "], u: ["Θ", "Θ", "\\Theta "], d: ["ϑ", "ϑ", "\\vartheta "]}
        - {k: ["λ", "λ", "\\lambda "], u: ["Λ", "Λ", "\\Lambda "], d: ["κ", "κ", "\\kappa "]}
        - {k: ["μ", "μ", "\\mu "], u: ["Μ", "Μ", "M"], d: ["ν", "ν", "\\nu "]}
      - - {k: ["π", "π", "\\pi "], u: ["Π", "Π", "\\Pi "], d: ["ξ", "ξ", "\\xi "]}
        - {k: ["ρ", "ρ", "\\rho "], u: ["Ρ", "Ρ", "P"], d: ["ϱ", "ϱ", "\\varrho "]}
        - {k: ["σ", "σ", "\\sigma "], u: ["Σ", "Σ", "\\Sigma "], d: ["ς", "ς", "\\varsigma "]}
        - {k: ["τ", "τ", "\\tau "], u: ["Τ", "Τ", "T"], d: ["υ", "υ", "\\upsilon "]}
      - - {k: ["φ", "φ", "\\varphi "], u: ["Φ", "Φ", "\\Phi "], d: ["ϕ", "ϕ", "\\phi "]}
        - {k: ["ψ", "ψ", "\\psi "], u: ["Ψ", "Ψ", "\\Psi "], d: ["ι", "ι", "\\iota "]}
        - {k: ["ω", "ω", "\\omega "], u: ["Ω", "Ω", "\\Omega "], d: ["ο", "ο", "o"]}
        - {k: ["η", "η", "\\eta "], u: ["Η", "Η", "H"]}
  - id: phys
    name: "物理"
    keys:
      - - {k: ["ℏ", "ℏ", "\\hbar "], u: ["h"]}
        - {k: ["Ω", "Ω", "\\Omega "]}
        - {k: ["Å", "Å", "\\text{Å}"], u: ["μ", "μ", "\\mu "]}
        - {k: ["k_B", "k_B", "k_\\mathrm{B}"], u: ["℃", "℃", "^\\circ\\mathrm{C}"]}
      - - {k: ["⟨ψ|", "⟨‸|", "\\langle ‸ |"]}
        - {k: ["|ψ⟩", "|‸⟩", "| ‸ \\rangle"]}
        - {k: ["⟨φ|ψ⟩", "⟨‸|⟩", "\\langle ‸ | \\rangle"]}
        - {k: ["†", "†", "^\\dagger "], u: ["⊗", "⊗", "\\otimes "]}
      - - {k: ["ẋ", "̇", "\\dot{‸}"], u: ["ẍ", "̈", "\\ddot{‸}"]}
        - {k: ["∂ₜ", "∂ₜ", "\\partial_t "]}
        - {k: ["d/dt", "d/dt ", "\\frac{d}{dt} "]}
        - {k: ["∇²", "∇²", "\\nabla^2 "]}
      - - {k: ["⇌", "⇌", "\\rightleftharpoons "]}
        - {k: ["→", "→", "\\to "], u: ["↑", "↑", "\\uparrow "], d: ["↓", "↓", "\\downarrow "]}
        - {k: ["⊥", "⊥", "\\perp "], u: ["∥", "∥", "\\parallel "]}
        - {k: ["Δ", "Δ", "\\Delta "], u: ["δ", "δ", "\\delta "]}
