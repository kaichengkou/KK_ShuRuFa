# 中文全拼键盘（Rime 雾凇拼音）
# 普通键写成 "主字符|上滑|下滑|左滑|右滑"，空着的方向留空；字符本身是 | 时写 \|
# 功能键写成 {fn: 名称, w: 宽度}；{spacer: 0.5} 是半个键宽的空位
# long: 里给某个字符补充长按选项（大小写、角标字符会自动加进去）
id: zh
label: 中文
engine: rime
rows:
  - [q|1, w|2, e|3, r|4, t|5, y|6, u|7, i|8, o|9, p|0]
  - [{spacer: 0.5}, "a|～", "s|！", "d|@", "f|#", "g|%", "h|“", "j|”", "k|*", "l|？", {spacer: 0.5}]
  - [{key: "'", style: soft, w: 1.5, long: [·, "-"]}, "z|（", "x|）", "c|——", "v|_", "b|：", "n|；", "m|、", {fn: backspace, w: 1.5}]
  - [{fn: symbols, label: "!#1", w: 1.5}, {fn: voice}, {key: "，", up: "、", style: soft, long: [、, ；, ：, ？, ！, ……, ·]}, {fn: space, w: 4.5}, {key: "。", up: "？", style: soft, long: [……, ？, ！, ～, ——]}, {fn: enter, w: 1.5}]
