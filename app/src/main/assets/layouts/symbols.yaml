# 符号面板分类。items 可以写成空格分隔的一行，也可以写成列表（含空格的条目用列表）
# 成对的符号（如 （））一次上屏一对，光标停在中间
categories:
  - id: zh
    name: 中文
    items: "， 。 、 ； ： ？ ！ “” ‘’ （） 【】 《》 〈〉 「」 『』 〔〕 …… —— · ～ ￥ ％ ＃ ＆ ＊ ＋ － ＝ ／ ＼ 〃 々 〇"
  - id: en
    name: 英文
    items: ", . ; : ? ! ' \" ( ) [ ] { } < > @ # $ % ^ & * - _ + = / \\ | ~ `"
  - id: ru
    name: 俄文
    items: ["«»", "„“", "—", "–", "№", "₽", "§", "…", "°", "±", "‰", "‑", {label: "⍽", text: "\\u00A0"}]
  - id: math
    name: 数学
    items: "+ − × ÷ = ≠ ≈ ≤ ≥ ± ∓ √ ∛ ∞ ∑ ∏ ∫ ∂ ∇ ∈ ∉ ⊂ ⊃ ∪ ∩ ∅ ∀ ∃ ∴ ∵ ∠ ⊥ ∥ ° ′ ″ ∝ ≡ π"
  - id: num
    name: 序号
    items: "① ② ③ ④ ⑤ ⑥ ⑦ ⑧ ⑨ ⑩ ⑪ ⑫ ⑴ ⑵ ⑶ ⑷ ⑸ ⒈ ⒉ ⒊ ⒋ ⒌ ㈠ ㈡ ㈢ ㈣ ㈤ Ⅰ Ⅱ Ⅲ Ⅳ Ⅴ Ⅵ Ⅶ Ⅷ Ⅸ Ⅹ ⅰ ⅱ ⅲ ⅳ ⅴ ❶ ❷ ❸ ❹ ❺"
  - id: arrow
    name: 箭头
    items: "← ↑ → ↓ ↔ ↕ ↖ ↗ ↘ ↙ ⇐ ⇒ ⇔ ⇑ ⇓ ⟵ ⟶ ⟷ ↩ ↪ ↺ ↻ ➜ ➔ ⇄ ⇌"
  - id: unit
    name: 单位
    items: "℃ ℉ ° ㎎ ㎏ ㎜ ㎝ ㎞ ㎡ ㎥ ㏄ ㎖ ㎘ ㎐ ㎑ ㎒ ㎾ ‰ ￥ $ € £ ₽ ¥ ₩ ¢"
  - id: greek
    name: 希腊
    items: "α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ ψ ω Α Β Γ Δ Ε Ζ Η Θ Ι Κ Λ Μ Ν Ξ Ο Π Ρ Σ Τ Υ Φ Χ Ψ Ω"
  - id: py
    name: 拼音
    items: "ā á ǎ à ō ó ǒ ò ē é ě è ī í ǐ ì ū ú ǔ ù ǖ ǘ ǚ ǜ ü ê"
  - id: special
    name: 特殊
    items: "★ ☆ ○ ● ◎ ◇ ◆ □ ■ △ ▲ ▽ ▼ ※ § № ♀ ♂ ✓ ✗ ♠ ♥ ♣ ♦ ♪ ♫"
  - id: box
    name: 制表
    items: "─ │ ┌ ┐ └ ┘ ├ ┤ ┬ ┴ ┼ ━ ┃ ┏ ┓ ┗ ┛ ═ ║ ╔ ╗ ╚ ╝ ╠ ╣ ╦ ╩ ╬"
